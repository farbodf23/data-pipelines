services:
  # Service 1: Target PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: postgres_warehouse
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432" #Left is the host port and right is the container's port. That means you can connect to the database using localhost:5432 on your host machine.
    #Volumes do not get deleted with an instance. 
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: Custom Python Ingestion Job
  etl_runner:
    build: .
    container_name: python_etl_job
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=warehouse
      - DB_USER=postgres
      - DB_PASS=postgres
    depends_on:
      db:
        condition: service_healthy

  # Service 3: Containerized pgAdmin 4 Management Dashboard
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_dashboard
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
